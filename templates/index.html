<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThaiStation Inventory</title>

    <!--CSS-->
    <link rel="stylesheet" href="/static/style.css">

    <!--Fonts & Icons-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

    <!--DataTables-->
    <link rel="stylesheet" href="static/lib/datatables/dataTables.css">


    </style>
</head>
<body>
    
    <div class="grid-container">

    <!--Header-->
        <header class="header">
            <div class="header-left">
                <i data-lucide="trending-up" class="nav-icon"></i>
                <p class="title" >Inventar / Bestseller </p>
            </div>
            <div class="header-right">
                <i data-lucide="search" class="nav-icon"></i>
            </div>
        </header>
        
    <!--Main-->
        <main class="main-container">
            <div class="main-title"></div>

                <div class="main-cards">
                    <div class="card">
                        <div class="card-inner">
                            <h3>GESAMTE PRODUKTE</h3>
                            <i data-lucide="trending-up" class="nav-icon"></i>
                        </div>
                        <p>{{len(alle_produkte)}}</p>
                    </div>
                

                
                    <div class="card">
                        <div class="card-inner">
                            <h3>AUF LAGER</h3>
                            <i data-lucide="package-check" class="nav-icon"></i>
                        </div>
                        <p>{{len(produkte)}}</p>
                    </div>
                

                
                    <div class="card">
                        <div class="card-inner">
                            <h3>AUSVERKAUFT</h3>
                            <i data-lucide="package-x" class="nav-icon"></i>
                        </div>
                        <p>{{len(ausverkauft_produkte)}}</p>
                    </div>
                

                
                    <div class="card">
                        <div class="card-inner">
                            <h3>UMSATZ GESAMT</h3>
                            <i data-lucide="circle-euro" class="nav-icon"></i>
                        </div>
                        <p>{{gesamtumsatz}}</p>
                    </div>
                </div>
            <table id="myTable" class="display">

                <thead>
                    <th>#</th>
                    <th>Produkt</th>
                    <th>Preis</th>
                    <th>Bestand</th>
                </thead>
                <tbody>
                <!--Artikel 1-->
                {% for p in produkte %}
                   <tr>
                        <td>{{p.id}}</td>
                        <td>{{p.name}}</td>
                        <td>{{p.preis}}</td>
                        <td>{{p.auf_lager}}</td>
                   </tr>
                {% endfor %}
                </tbody>
            </table>
        <!--jQuery-->
        <script src="static/lib/datatables/jquery/jquery-4.0.0.js"></script>
        <!--DataTables-->
        <script src="static/lib/datatables/dataTables.js"></script>
        <script>

            $(document).ready(function () {
                $('#myTable').DataTable();
            });

        </script>   

        </main>


    
        
    </div>
    <script src="static/scripts.js"></script>
   
 

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    
    <script>
        lucide.createIcons();
    </script>

    

</body>
</html>
